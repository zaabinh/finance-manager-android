spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
logging:
  level:
    root: INFO
    com.fintrack.api: DEBUG
app:
  auth:
    jwt-secret: ${JWT_SECRET:local-development-jwt-secret-do-not-use-in-production}
