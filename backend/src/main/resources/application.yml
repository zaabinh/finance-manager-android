spring:
  application:
    name: finance-manager-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5433}}/${DB_NAME:${POSTGRES_DB}}
    username: ${DB_USERNAME:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fintrack
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: fintrack
    clean-disabled: true
    validate-on-migrate: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  notifications:
    producers-enabled: ${NOTIFICATION_PRODUCERS_ENABLED:false}
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    action-origin: ${NOTIFICATION_ACTION_ORIGIN:}
  auth:
    issuer: ${AUTH_JWT_ISSUER:fintrack-api}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:30d}
    otp-ttl: ${AUTH_OTP_TTL:10m}
    # Window in which a just-rotated refresh token returns the same successor instead of triggering reuse detection.
    refresh-reuse-grace-period: ${AUTH_REFRESH_REUSE_GRACE_PERIOD:20s}
    # true: refresh token only in an HttpOnly; Secure; SameSite=Strict cookie (browsers). false: JSON body (mobile).
    refresh-cookie: ${AUTH_REFRESH_COOKIE:false}
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    public-key: ${AUTH_JWT_PUBLIC_KEY:}
    rate-limit-key-prefix: ${AUTH_RATE_LIMIT_KEY_PREFIX:fintrack:dev:auth:rate-limit:}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:}
    # Public URL of static/email/logo.png; email clients block SVG and data: images.
    logo-url: ${MAIL_LOGO_URL:http://localhost:${SERVER_PORT:8080}/email/logo.png}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
