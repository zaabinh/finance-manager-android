name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Android Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build mockDebug APK and unit tests
        run: bash ./gradlew --no-daemon --stacktrace --console=plain :app:assembleMockDebug :app:testMockDebugUnitTest

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports/tests/testMockDebugUnitTest/
            android/app/build/test-results/testMockDebugUnitTest/
            android/build/reports/problems/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload mockDebug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-mock-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/mock/debug/app-mock-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
