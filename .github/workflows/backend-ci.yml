name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Backend Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        run: bash ./mvnw -B -ntp test

      - name: Package application
        run: bash ./mvnw -B -ntp -DskipTests package

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload application jar
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/target/finance-manager-backend-*.jar
          if-no-files-found: error
          retention-days: 7
