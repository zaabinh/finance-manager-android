name: Staging Deployment Checks

on:
  push:
    paths:
      - 'deploy/staging/**'
      - '.github/workflows/deploy-staging*.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'deploy/staging/**'
      - '.github/workflows/deploy-staging*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate staging deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check script syntax and deployment regression tests
        run: |
          bash -n deploy/staging/deploy.sh
          python3 -m unittest discover -s deploy/staging/tests -p 'test_*.py' -v
